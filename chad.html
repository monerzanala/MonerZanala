<div class="poem">
<h1>চাঁদের কাছে তোমার গল্প</h1>
<div class="meta">প্রেমের কবিতা · মনন</div>
<div class="poem-text">চাঁদের কাছে আজও বলি
আমাদের না-বলা গল্প।
তারারাও নীরবে শোনে,
আর রাত জেগে থাকে তোমার নামে।</div>
